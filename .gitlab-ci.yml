stages:
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

deploy_production:
  stage: deploy
  tags:
    - abvc-mobile
  resource_group: abvc-mobile-production
  environment:
    name: production
  script:
    - test -n "${NEXT_PUBLIC_API_BASE_URL:-}"
    - test -n "${NEXT_PUBLIC_API_TOKEN:-}"
    - umask 077
    - printf 'NEXT_PUBLIC_API_BASE_URL=%s\nNEXT_PUBLIC_API_TOKEN=%s\n' "$NEXT_PUBLIC_API_BASE_URL" "$NEXT_PUBLIC_API_TOKEN" > .env
    - trap 'rm -f .env' EXIT
    - docker compose -f docker-compose.yml config --quiet
    - docker compose -f docker-compose.yml build --pull=false
    - docker compose -f docker-compose.yml up -d --force-recreate --remove-orphans
    - timeout 90 sh -c 'until curl --fail --silent --show-error https://abvc-surveillance.org/mobile >/dev/null; do sleep 3; done'
    - curl --fail --silent --show-error https://abvc-surveillance.org/mobile >/dev/null
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
